name: Cambio de documentación
description: Corrija o amplíe documentación con fuentes, audiencia y verificación explícitas.
title: "docs: "
labels:
  - "type:docs"
body:
  - type: textarea
    id: problema-contexto
    attributes:
      label: Problema y contexto
      description: Explique qué lector no puede actuar correctamente y por qué.
    validations:
      required: true
  - type: textarea
    id: evidencia-verificable
    attributes:
      label: Evidencia verificable
      description: Enlace el código, comportamiento o fuente canónica que respalda el cambio.
    validations:
      required: true
  - type: textarea
    id: alcance-no-objetivos
    attributes:
      label: Alcance y no objetivos
      description: Delimite documentos, recorrido de lectura y contenido excluido.
    validations:
      required: true
  - type: textarea
    id: criterios-aceptacion
    attributes:
      label: Criterios de aceptación
      description: Enumere resultados observables mediante una lista de comprobación.
    validations:
      required: true
  - type: textarea
    id: plan-validacion
    attributes:
      label: Plan de validación
      description: Indique enlaces, linters o recorridos que probarán la documentación.
    validations:
      required: true
  - type: textarea
    id: dependencias-riesgos
    attributes:
      label: Dependencias y riesgos
      description: Identifique fuentes pendientes, drift posible o indique «Ninguno».
    validations:
      required: true
