name: Reporte de error
description: Documente un defecto reproducible, su impacto y la prueba del arreglo.
title: "bug: "
labels:
  - "type:bug"
body:
  - type: textarea
    id: problema-contexto
    attributes:
      label: Problema y contexto
      description: Explique el comportamiento incorrecto, dónde ocurre y a quién afecta.
    validations:
      required: true
  - type: textarea
    id: evidencia-verificable
    attributes:
      label: Evidencia verificable
      description: Incluya pasos de reproducción, resultado actual y fuentes comprobables.
    validations:
      required: true
  - type: textarea
    id: alcance-no-objetivos
    attributes:
      label: Alcance y no objetivos
      description: Delimite qué debe corregirse y qué queda expresamente fuera.
    validations:
      required: true
  - type: textarea
    id: criterios-aceptacion
    attributes:
      label: Criterios de aceptación
      description: Enumere resultados observables mediante una lista de comprobación.
    validations:
      required: true
  - type: textarea
    id: plan-validacion
    attributes:
      label: Plan de validación
      description: Nombre las pruebas, comandos o escenarios que demostrarán el arreglo.
    validations:
      required: true
  - type: textarea
    id: dependencias-riesgos
    attributes:
      label: Dependencias y riesgos
      description: Identifique bloqueos, compatibilidad, seguridad o indique «Ninguno».
    validations:
      required: true
