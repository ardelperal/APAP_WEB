name: Mantenimiento y tooling
description: Delimite un cambio operativo sin atribuirle comportamiento de producto.
title: "chore: "
labels:
  - "type:chore"
body:
  - type: textarea
    id: problema-contexto
    attributes:
      label: Problema y contexto
      description: Explique la deuda operativa, de dependencias o de tooling.
    validations:
      required: true
  - type: textarea
    id: evidencia-verificable
    attributes:
      label: Evidencia verificable
      description: Incluya salidas, versiones, auditorías o rutas comprobables.
    validations:
      required: true
  - type: textarea
    id: alcance-no-objetivos
    attributes:
      label: Alcance y no objetivos
      description: Delimite qué cambia y qué comportamiento debe permanecer intacto.
    validations:
      required: true
  - type: textarea
    id: criterios-aceptacion
    attributes:
      label: Criterios de aceptación
      description: Enumere resultados observables mediante una lista de comprobación.
    validations:
      required: true
  - type: textarea
    id: plan-validacion
    attributes:
      label: Plan de validación
      description: Nombre comandos, builds o comprobaciones que cerrarán el trabajo.
    validations:
      required: true
  - type: textarea
    id: dependencias-riesgos
    attributes:
      label: Dependencias y riesgos
      description: Identifique rollout, rollback, compatibilidad o indique «Ninguno».
    validations:
      required: true
