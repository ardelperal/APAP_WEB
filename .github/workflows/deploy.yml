name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  evidence:
    name: evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Issue #879: only checks out the repo and reads the Actions API
    # (GET .../actions/workflows/ci.yml/runs) — it never pushes an image,
    # unlike the workflow-level default this job used to inherit.
    permissions:
      contents: read
      actions: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
      source: ${{ steps.check.outputs.source }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Find the green CI run that proved this tree
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verified=false
          source="none"

          if head2=$(git rev-parse --verify -q 'HEAD^2'); then
            tree_merged=$(git rev-parse 'HEAD^{tree}')
            tree_branch=$(git rev-parse "${head2}^{tree}")
            if [ "$tree_merged" = "$tree_branch" ]; then
              body=$(mktemp)
              code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${head2}&status=success")
              if [ "$code" != "200" ]; then
                echo "::error::the evidence query itself failed (HTTP ${code})."
                exit 1
              fi
              green=$(jq '[.workflow_runs[] | select(.event == "pull_request")] | length' "$body")
              if [ "${green:-0}" -gt 0 ]; then
                verified=true
                source="ci run for ${head2:0:8} (${green} green)"
              else
                source="no green ci run for merged head ${head2:0:8}"
              fi
            else
              source="main moved: merged tree differs from the reviewed branch tree"
            fi
          else
            source="not a merge commit"
          fi

          echo "verified=${verified}" >> "$GITHUB_OUTPUT"
          echo "source=${source}" >> "$GITHUB_OUTPUT"
          echo "::notice::deploy evidence: ${source} -> verified=${verified}"

      - name: Refuse to deploy an unverified tree
        if: steps.check.outputs.verified != 'true'
        run: |
          echo "::error::Refusing to deploy: ${{ steps.check.outputs.source }}."
          exit 1

  release-e2e-gate:
    name: release-e2e-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Issues #1082 and #1131: fail-closed gate on the production verdicts of
    # the PREVIOUSLY DEPLOYED revision (head_sha of the latest successful
    # deploy.yml run on main, excluding this run). Two commit statuses must
    # both be valid for that SHA: release/smoke-production (written by the
    # production-smoke job after the deploy) and release/e2e-production
    # (opened as pending or resolved as not-required by release-e2e-record;
    # when the range is e2e-sensitive the operator resolves it per
    # docs/runbooks/e2e-production.md: success, failure, or a skipped:<reason>
    # bypass valid for that one SHA). A pending, failed or absent verdict
    # blocks the next deploy until the operator rolls back or records
    # success/bypass. The previous SHA is exposed as an output so
    # release-e2e-record can decide whether this range needs the e2e battery.
    # It runs no e2e suite and holds no secret.
    permissions:
      contents: read
      actions: read
      statuses: read
    outputs:
      previous_sha: ${{ steps.gate.outputs.previous_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # The hosted image ships no `python` (issue #533 precedent).
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"

      - name: Require the previous revision's smoke and e2e verdicts
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          runs=$(mktemp)
          code=$(curl -sS -o "$runs" -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=5")
          if [ "$code" != "200" ]; then
            echo "::error::the previous-deploy query failed (HTTP ${code})."
            exit 1
          fi
          prev_sha=$(jq -r --arg run "$GITHUB_RUN_ID" \
            '[.workflow_runs[] | select((.id | tostring) != $run)][0].head_sha // empty' "$runs")
          echo "previous_sha=${prev_sha}" >> "$GITHUB_OUTPUT"
          if [ -z "$prev_sha" ]; then
            echo "::notice::release-e2e-gate: no previous successful deploy found (first deploy); nothing to verify."
            exit 0
          fi

          status=$(mktemp)
          code=$(curl -sS -o "$status" -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/commits/${prev_sha}/status")
          if [ "$code" != "200" ]; then
            echo "::error::the release verdict query for ${prev_sha} failed (HTTP ${code})."
            exit 1
          fi
          # Evaluate both contexts so one run reports every missing verdict.
          failed=0
          for context in release/smoke-production release/e2e-production; do
            python scripts/check_release_evidence.py --sha "$prev_sha" --context "$context" < "$status" || failed=1
          done
          exit "$failed"

  ui-e2e-gate:
    name: ui-e2e-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Issue #895: fail-closed gate for the UI path to deployment. It runs NO
    # e2e suite and holds NO secret: it recomputes ui_changed for the merged
    # revision (same UI surface single source of truth as ci.yml, consumed
    # via --print-ui-paths) and, when UI paths changed, verifies via the
    # read-only check-runs API that a CI run on the reviewed revision had
    # the `e2e` job conclude success. Failure, cancellation, unexpected
    # skip, incomplete run or absent check all fail this gate and, via
    # deploy's needs:, block the deployment. A revision with no UI-path
    # change passes with an explicit exemption line.
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The parent-commit diff and the HEAD^2 resolution need history.
          fetch-depth: 0

      # The hosted image ships no `python` (issue #533 precedent).
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"

      - name: Gate the UI revision on green e2e evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Issue #895 fix round 1 (JD-B-001): fail-closed INVERTED detection.
          # The checker prints the NON-UI allowlist and classifies the
          # changed-file set (via --ui-changed); ui_changed is true unless
          # EVERY changed file is allowlisted — all of app/** affects the
          # browser (FastAPI renders Jinja from Python), so a UI prefix list
          # could never be exhaustive.
          NON_UI_PATHS="$(python scripts/check_required_jobs.py --print-ui-paths)"
          ui_changed=true
          CHANGED=""
          if [ -n "$(git rev-parse --verify -q 'HEAD^')" ]; then
            # Issue #895 fix round 1 (JD-B-002): the diff base is
            # github.event.before — the main tip this push replaced, i.e.
            # exactly the revision delta against what is already deployed.
            # HEAD^ only covers the last commit of a multi-commit push and
            # stays as the fallback (zero-SHA initial push, dispatch).
            BEFORE="$EVENT_BEFORE"
            if [ -n "$BEFORE" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE" 2>/dev/null; then
              CHANGED="$(git diff --name-only "$BEFORE" 'HEAD')"
              ui_changed="$(printf '%s\n' "$CHANGED" | python scripts/check_required_jobs.py --ui-changed)"
            else
              CHANGED="$(git diff --name-only 'HEAD^' 'HEAD')"
              ui_changed="$(printf '%s\n' "$CHANGED" | python scripts/check_required_jobs.py --ui-changed)"
            fi
          else
            echo "::warning::no event.before and no parent commit; assuming UI changed (fail-closed)" >&2
          fi

          # ANTI-SELF-EXEMPTION toll (issue #895 fix round 1, JD-A-001): the
          # gate's own source cannot be edited without paying the e2e toll —
          # these three files DEFINE the detection, so a change to any of
          # them forces ui_changed=true in BOTH workflow consumers.
          for path in $CHANGED; do
            case "$path" in
              scripts/check_required_jobs.py|.github/workflows/ci.yml|.github/workflows/deploy.yml)
                ui_changed=true
                echo "::notice::gate-source change ($path) forces ui_changed=true (anti-self-exemption toll, issue #895)."
                break
                ;;
            esac
          done

          if [ "$ui_changed" != "true" ]; then
            echo "::notice::ui-e2e-gate exemption: no UI-relevant change in this revision; e2e evidence not required (issue #895)."
            exit 0
          fi

          # pull_request check-runs are reported on the PR head SHA, not on
          # the merge commit, so resolve the reviewed head (evidence-job
          # precedent) and bind the tree before querying.
          if head2=$(git rev-parse --verify -q 'HEAD^2'); then
            tree_merged=$(git rev-parse 'HEAD^{tree}')
            tree_branch=$(git rev-parse "${head2}^{tree}")
            if [ "$tree_merged" != "$tree_branch" ]; then
              echo "::error::main moved: merged tree differs from the reviewed branch tree; cannot bind e2e evidence to this revision. Recovery: update the branch on the new main (merge or rebase), let ci.yml run green on the updated branch, then re-merge — re-running ci.yml by dispatch on the existing merge commit does NOT satisfy this gate."
              exit 1
            fi
            reviewed_sha="$head2"
          else
            reviewed_sha="$GITHUB_SHA"
          fi

          # filter=latest (F4, JD-B-006/JD-A-002): return only the most
          # recent check run per check name/app instead of every historical
          # run. Accepted fail-closed limitation: the response is one page
          # of at most 100 check runs; if the e2e check is not in the first
          # page (page-1 limit), the query below reports "no e2e check run"
          # and the gate fails closed rather than passing without evidence.
          # The jq selections are scoped to .app.slug == "github-actions" so
          # a third-party check app reporting an 'e2e' check cannot satisfy
          # the gate.
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${reviewed_sha}/check-runs?per_page=100&filter=latest")
          if [ "$code" != "200" ]; then
            echo "::error::the e2e-evidence query itself failed (HTTP ${code})."
            exit 1
          fi

          e2e_count=$(jq '[.check_runs[] | select(.name == "e2e" and .app.slug == "github-actions")] | length' "$body")
          if [ "${e2e_count:-0}" -eq 0 ]; then
            echo "::error::no e2e check run for ${reviewed_sha} although the revision changed UI paths. A UI change cannot deploy without e2e on the integrated revision; run ci.yml (e2e job) on that SHA — see .github/workflows/ci.yml."
            exit 1
          fi
          pending=$(jq '[.check_runs[] | select(.name == "e2e" and .app.slug == "github-actions" and .status != "completed")] | length' "$body")
          if [ "${pending:-0}" -gt 0 ]; then
            echo "::error::the e2e check run for ${reviewed_sha} has not completed; wait for ci.yml to finish before deploying."
            exit 1
          fi
          bad=$(jq -r '[.check_runs[] | select(.name == "e2e" and .app.slug == "github-actions") | .conclusion] | map(select(. != "success")) | join(", ")' "$body")
          if [ -n "$bad" ]; then
            echo "::error::e2e on ${reviewed_sha} did not conclude success (conclusions: ${bad} — failure, cancellation or unexpected skip). A UI change cannot deploy without green e2e on the integrated revision; see .github/workflows/ci.yml."
            exit 1
          fi
          echo "::notice::ui-e2e-gate: e2e concluded success on ${reviewed_sha} for a UI-changing revision (issue #895). (non-UI allowlist: ${NON_UI_PATHS})"

  deploy:
    name: deploy
    runs-on: [self-hosted, Linux, ARM64, apap, oracle, coolify, noble, deploy]
    timeout-minutes: 30
    needs: [evidence, release-e2e-gate, ui-e2e-gate]
    if: needs.evidence.outputs.verified == 'true'
    # id-token: write lets Cosign exchange this job's short-lived GitHub OIDC
    # token for an ephemeral Fulcio certificate (keyless signing, no stored
    # key material). The rest mirrors the workflow-level defaults so this
    # override only adds scope, it does not narrow anything the job already had.
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/ardelperal/apap-web
      DEPLOY_TAG: deploy-current
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up locked Python environment
        uses: ./.github/actions/setup-python

      - name: Validate deployment configuration
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_WEBHOOK_SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}
          DEPLOY_HEALTH_URL: ${{ vars.APAP_DEPLOY_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "::error::COOLIFY_WEBHOOK_URL is not configured."
            exit 1
          fi
          if [ -z "$COOLIFY_WEBHOOK_SECRET" ]; then
            echo "::error::COOLIFY_WEBHOOK_SECRET is not configured."
            exit 1
          fi
          if [ -z "$DEPLOY_HEALTH_URL" ]; then
            echo "::error::DEPLOY_HEALTH_URL is not configured."
            exit 1
          fi

      - name: Check Docker daemon
        run: timeout 15 docker info

      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish immutable image
        id: publish
        run: |
          set -euo pipefail
          previous_digest=""
          previous_revision=""
          if previous_digest=$(docker buildx imagetools inspect \
            --format '{{.Manifest.Digest}}' "${IMAGE}:${DEPLOY_TAG}" 2>/dev/null); then
            docker pull "${IMAGE}@${previous_digest}"
            previous_revision=$(docker image inspect \
              --format '{{range .Config.Env}}{{println .}}{{end}}' \
              "${IMAGE}@${previous_digest}" | sed -n 's/^APAP_BUILD_SHA=//p' | head -1)
          fi

          metadata=$(mktemp)
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform linux/arm64 \
            --build-arg "BUILD_SHA=${GITHUB_SHA}" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file "$metadata" \
            --push .
          digest=$(jq -er '."containerimage.digest"' "$metadata")
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "previous_digest=${previous_digest}" >> "$GITHUB_OUTPUT"
          echo "previous_revision=${previous_revision}" >> "$GITHUB_OUTPUT"
          echo "::notice::published ${IMAGE}@${digest}"

      - name: Scan the published image
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            "${IMAGE}@${DIGEST}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3

      - name: Sign the published digest with GitHub OIDC
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Smoke-test the exact image digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network="apap-deploy-${suffix}"
          database="apap-db-${suffix}"
          application="apap-app-${suffix}"
          cleanup() {
            docker rm -f "$application" "$database" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$network"
          docker run -d --name "$database" --network "$network" \
            -e POSTGRES_USER=apap -e POSTGRES_DB=apap \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          for _ in $(seq 1 30); do
            docker exec "$database" pg_isready -U apap -d apap && break
            sleep 1
          done
          docker exec "$database" pg_isready -U apap -d apap

          docker pull "${IMAGE}@${DIGEST}"
          docker run -d --name "$application" --network "$network" \
            -e APAP_DEBUG=true \
            -e APAP_LOCAL_DB_URL=postgresql://apap@${database}:5432/apap \
            "${IMAGE}@${DIGEST}"
          for _ in $(seq 1 30); do
            if body=$(docker exec "$application" curl -fsS http://127.0.0.1:8000/healthz); then
              break
            fi
            sleep 1
          done
          revision=$(printf '%s' "$body" | jq -er '.revision')
          test "$revision" = "$GITHUB_SHA"

      - name: Verify the published digest is signed by this workflow
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Promote the verified digest
        id: promote
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: docker buildx imagetools create --tag "${IMAGE}:${DEPLOY_TAG}" "${IMAGE}@${DIGEST}"

      - name: Trigger Coolify webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_WEBHOOK_SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python scripts/coolify_webhook.py

      - name: Verify deployed revision
        env:
          DEPLOY_HEALTH_URL: ${{ vars.APAP_DEPLOY_HEALTH_URL }}
        run: python scripts/verify_deployment.py --url "$DEPLOY_HEALTH_URL" --revision "$GITHUB_SHA"

      - name: Roll back to the previous digest
        if: failure() && steps.promote.outcome == 'success' && steps.publish.outputs.previous_digest != ''
        env:
          PREVIOUS_DIGEST: ${{ steps.publish.outputs.previous_digest }}
          PREVIOUS_REVISION: ${{ steps.publish.outputs.previous_revision }}
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_WEBHOOK_SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ steps.publish.outputs.previous_revision }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMIT_MESSAGE: rollback after failed deployment verification
          DEPLOY_HEALTH_URL: ${{ vars.APAP_DEPLOY_HEALTH_URL }}
        run: |
          set -euo pipefail
          test -n "$PREVIOUS_REVISION"
          cosign verify "${IMAGE}@${PREVIOUS_DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          docker buildx imagetools create \
            --tag "${IMAGE}:${DEPLOY_TAG}" "${IMAGE}@${PREVIOUS_DIGEST}"
          python scripts/coolify_webhook.py
          python scripts/verify_deployment.py \
            --url "$DEPLOY_HEALTH_URL" --revision "$PREVIOUS_REVISION"
          echo "::error::Deployment failed and was rolled back to ${PREVIOUS_DIGEST}."

  production-smoke:
    name: production-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [deploy]
    if: needs.deploy.result == 'success'
    # Issue #1131: automatic, unauthenticated smoke of the deployed revision.
    # It holds NO secret (the health URL is a repository variable, not a
    # secret) and logs nobody in: /healthz reports this SHA, /login answers
    # and an anonymous / redirects to /login. It always records the verdict as
    # the commit status release/smoke-production on the deployed SHA (target
    # is this run) and fails the job when the smoke failed, so the next deploy
    # is blocked by release-e2e-gate. It is NOT the authenticated e2e battery.
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # The hosted image ships no `python` (issue #533 precedent).
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"

      - name: Run the unauthenticated production smoke
        env:
          DEPLOY_HEALTH_URL: ${{ vars.APAP_DEPLOY_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HEALTH_URL" ]; then
            echo "::error::APAP_DEPLOY_HEALTH_URL is not configured."
            exit 1
          fi
          python scripts/production_smoke.py --health-url "$DEPLOY_HEALTH_URL" --revision "$GITHUB_SHA"

      - name: Record release/smoke-production on the deployed revision
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="production smoke passed for ${GITHUB_SHA:0:8}"
          else
            state=failure
            description="production smoke failed for ${GITHUB_SHA:0:8}; see the run"
          fi
          body=$(mktemp)
          payload=$(jq -n \
            --arg state "$state" \
            --arg description "$description" \
            --arg url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, context: "release/smoke-production", description: $description, target_url: $url}')
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}")
          if [ "$code" != "201" ]; then
            echo "::error::could not record release/smoke-production=${state} on ${GITHUB_SHA} (HTTP ${code})."
            exit 1
          fi
          echo "::notice::release/smoke-production=${state} recorded on ${GITHUB_SHA}."

  release-e2e-record:
    name: release-e2e-record
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [release-e2e-gate, deploy]
    if: needs.deploy.result == 'success'
    # Issues #1082 and #1131: production e2e validation happens AFTER deploy
    # (see docs/runbooks/e2e-production.md), so the evidence is bound to the
    # deployed revision instead of a global repository variable. This job
    # decides whether the range since the previous deployed revision touches an
    # e2e-sensitive path (scripts/check_release_e2e_required.py, which needs
    # the full history): exit 10 (required, also when it cannot decide) opens
    # the validation window with release/e2e-production=pending; exit 0 records
    # success with a not-required description; anything else fails the job. No
    # previous deploy means required. The operator then records success,
    # failure (=> digest rollback) or a bypass (success with description
    # skipped:<reason>) on that same SHA, and scripts/check_release_evidence.py
    # evaluates it. It runs NO e2e suite, holds NO secret beyond the job token
    # and writes nothing but a status.
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The range base..head needs the history between the two deploys.
          fetch-depth: 0

      # The hosted image ships no `python` (issue #533 precedent).
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"

      - name: Decide and record the e2e verdict window
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_SHA: ${{ needs.release-e2e-gate.outputs.previous_sha }}
        run: |
          set -euo pipefail
          runbook="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/runbooks/e2e-production.md"

          required=true
          if [ -n "$PREVIOUS_SHA" ]; then
            rc=0
            python scripts/check_release_e2e_required.py --base "$PREVIOUS_SHA" --head "$GITHUB_SHA" || rc=$?
            case "$rc" in
              0) required=false ;;
              10) required=true ;;
              *)
                echo "::error::scripts/check_release_e2e_required.py exited ${rc}; cannot decide whether e2e is required."
                exit 1
                ;;
            esac
          else
            echo "::notice::no previous deployed revision (first deploy); the e2e validation is required."
          fi

          if [ "$required" = "true" ]; then
            state=pending
            description="awaiting runbook validation: e2e-sensitive paths changed"
          else
            state=success
            description="not-required: no e2e-sensitive path changed since ${PREVIOUS_SHA:0:8}"
          fi

          body=$(mktemp)
          payload=$(jq -n \
            --arg state "$state" \
            --arg description "$description" \
            --arg url "$runbook" \
            '{state: $state, context: "release/e2e-production", description: $description, target_url: $url}')
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}")
          if [ "$code" != "201" ]; then
            echo "::error::could not record the ${state} release/e2e-production status on ${GITHUB_SHA} (HTTP ${code})."
            exit 1
          fi
          if [ "$required" = "true" ]; then
            echo "::notice::release/e2e-production is pending on ${GITHUB_SHA}. Validate production and record the verdict on that SHA per docs/runbooks/e2e-production.md."
          else
            echo "::notice::release/e2e-production is not required on ${GITHUB_SHA}: ${description}."
          fi
