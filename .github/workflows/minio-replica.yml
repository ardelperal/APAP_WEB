name: minio-replica

# Issue #973 (follow-up to PR #981): the upstream `minio/minio` binary
# images no longer exist. MinIO Community Edition went source-only in late
# 2025 and its images were removed from Docker Hub, quay.io, and every
# public mirror (minio/minio#21662), so the e2e job in ci.yml cannot pull
# MinIO from any registry. Building from the upstream repository directly
# is not an option either: the upstream `Dockerfile` at the pinned tag is a
# thin wrapper (`FROM minio/minio:latest`) over the exact image that was
# removed — the first live run (36247204251) failed exactly there — and the
# MinIO community download host returns HTTP 410 for release archives,
# killing the upstream `Dockerfile.release` binary-download path too. The
# only viable
# build is from source, so this workflow carries its own inline multi-stage
# Dockerfile (Go builder over the pinned checkout, ubuntu:24.04 runtime)
# and publishes the replica to this repository's GHCR namespace, where the
# e2e service container pulls it as `ghcr.io/ardelperal/minio:ci`.
#
# Manual dispatch only: this workflow pushes a package, so it must never
# run on untrusted pull-request code. Run it with:
#   gh workflow run minio-replica.yml
# Runbook: docs/operations/minio-replica.md.
on:
  workflow_dispatch:

# Stale replica builds are worthless: a newer dispatch supersedes the
# one still running, so cancel it instead of spending capacity on an
# image nobody will push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Issue #879 convention: the job declares its own minimal block
    # instead of silently inheriting the workflow-level default.
    permissions:
      contents: read
      packages: write
    env:
      # Issue #973: pinned MinIO CE release the replica is built from.
      # Verified on 2026-09-26 against
      # `git ls-remote --tags https://github.com/minio/minio` as the
      # highest existing RELEASE.2025-* tag. Bumping this value is the
      # whole update procedure — see docs/operations/minio-replica.md.
      RELEASE_TAG: RELEASE.2025-10-15T17-29-55Z
    steps:
      - name: Check out the pinned MinIO CE release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: minio/minio
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Log in to ghcr.io
        # The ephemeral GITHUB_TOKEN of this run is enough to push a
        # package under this repository's namespace; no PAT is involved.
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build the replica image from pinned source
        # The build context is the pinned MinIO CE checkout in the
        # workspace. The Dockerfile mirrors the upstream Makefile build
        # (CGO_ENABLED=0, kqueue tag, gen-ldflags) but replaces the
        # wrapper `Dockerfile` with a self-contained multi-stage build:
        # stage 1 compiles the binary from source, stage 2 installs a
        # minimal ubuntu:24.04 runtime with curl (ci.yml healthchecks the
        # service with `curl --fail .../minio/health/live`) plus the
        # upstream entrypoint script.
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/minio-replica.Dockerfile" <<'EOF'
          FROM golang:1.24-alpine AS build
          RUN apk add --no-cache git bash
          WORKDIR /src
          COPY . .
          RUN CGO_ENABLED=0 go build -tags kqueue -trimpath --ldflags "$(go run buildscripts/gen-ldflags.go)" -o /out/minio .

          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          COPY --from=build /out/minio /usr/bin/minio
          COPY dockerscripts/docker-entrypoint.sh /usr/bin/docker-entrypoint.sh
          RUN chmod +x /usr/bin/minio /usr/bin/docker-entrypoint.sh
          EXPOSE 9000 9001
          VOLUME /data
          ENTRYPOINT ["/usr/bin/docker-entrypoint.sh"]
          CMD ["minio"]
          EOF
          docker build \
            -f "$GITHUB_WORKSPACE/minio-replica.Dockerfile" \
            -t "ghcr.io/ardelperal/minio:${RELEASE_TAG}" \
            -t "ghcr.io/ardelperal/minio:ci" \
            .

      - name: Push both tags and capture the digest
        id: push
        run: |
          set -euo pipefail
          out=$(docker push "ghcr.io/ardelperal/minio:${RELEASE_TAG}")
          echo "$out"
          docker push "ghcr.io/ardelperal/minio:ci"
          digest=$(printf '%s\n' "$out" | grep -oE 'sha256:[a-f0-9]{64}' | tail -1)
          if [ -z "$digest" ]; then
            echo "::error::docker push output contained no digest; refusing to report an empty pin" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Publish the image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "MinIO replica published: ghcr.io/ardelperal/minio:${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "Pin this digest in .github/workflows/ci.yml once the e2e job" >> "$GITHUB_STEP_SUMMARY"
          echo "records it (issue #973)." >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/ardelperal/minio:${RELEASE_TAG} pushed as ${DIGEST}"
