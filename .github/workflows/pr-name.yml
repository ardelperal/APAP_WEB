name: pr-name
on:
  pull_request:
# See ci.yml for the cancel-in-progress rationale (issue #530). These gates take
# seconds, so cancellation would cost little - uniformity is the point: one rule
# for the whole repository is easier to keep true than a per-workflow judgement.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # The GitHub-hosted image came with a Python. This runner image does not,
      # so every `python scripts/...` here exited 127 the moment the job moved.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.11"
      - name: Validate head branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_ACTOR: ${{ github.actor }}
        run: python scripts/check_branch_name.py "$HEAD_REF" "$PR_ACTOR"
