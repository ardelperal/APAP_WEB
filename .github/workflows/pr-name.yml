name: pr-name
on:
  pull_request:
    branches: [main]
jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Validate head branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: python scripts/check_branch_name.py "$HEAD_REF"
