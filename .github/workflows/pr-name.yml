name: pr-name
on:
  pull_request:
# See ci.yml for the cancel-in-progress rationale (issue #530). These gates take
# seconds, so cancellation would cost little - uniformity is the point: one rule
# for the whole repository is easier to keep true than a per-workflow judgement.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Explicit minimum-scope permissions (issue #682): without an
# explicit block, this workflow inherits the repository-wide
# GITHUB_TOKEN permission set, which can silently widen over time.
# ``contents: read`` is the only scope these gates need; the rest
# are intentionally NOT requested.
permissions:
  contents: read

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # The GitHub-hosted image came with a Python. This runner image does not,
      # so every `python scripts/...` here exited 127 the moment the job moved.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"
      - name: Validate head branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python scripts/check_branch_name.py "$HEAD_REF" "$PR_AUTHOR"
