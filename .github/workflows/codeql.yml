# Issue #700 — SAST semántico con CodeQL (análisis de código Python).
#
# Corre en runners GitHub-hosted estándar (gratuito en repos públicos), lo cual
# también evita depender del runner self-hosted mientras se resuelve el bloqueo de
# facturación de la issue #698.
#
# El gate 'security' existente (pip-audit + gitleaks + trivy) cubre dependencias,
# secretos y Docker; CodeQL complementa con análisis semántico de código fuente.
# La regla S de ruff (equivalente a bandit) permanece activa por separado en lint.

name: "CodeQL SAST"

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "**.py"
      - ".github/workflows/codeql.yml"
  schedule:
    # Lun 06:47 UTC — horario odd para evitar top-of-hour stampede.
    - cron: "47 6 * * 1"

# Concurrency: una sola instancia por ref. Cancelar un run de CodeQL
# es aceptable — es análisis de solo lectura y no hay estado duradero.
# Esto satisface el gate de check_workflows.py (issue #530).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: "CodeQL analysis (Python)"
    # Runner GitHub-hosted estándar — no comparte Docker daemon con nada operativo.
    # Usa ubuntu-24.04 (pinned, no -latest) para pasar el gate
    # test_no_workflow_runs_on_a_floating_runner (issue #520).
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: python
          # La suite estándar 'security-extended' es suficiente para el gate SAST
          # sin generar ruido de falsos positivos.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          category: "/language:python"
