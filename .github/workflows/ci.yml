name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

      - name: Diagnostic secret-leak scan
        run: grep -rE '(http://|https://|sk-|ghp_)[A-Za-z0-9]+' .github/ || true

  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run pytest with deprecations as errors
        run: python -m pytest -W error::DeprecationWarning

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build package
        run: python -m build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: build
    if: ${{ vars.ENABLE_E2E == 'true' }}
    steps:
      - name: E2E placeholder
        run: |
          echo "TODO(E2E-01): enable when Playwright harness lands"
