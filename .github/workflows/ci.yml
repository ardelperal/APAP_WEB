name: ci

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  # Allow running CI manually against any branch (e.g. to re-validate
  # an open PR after the workflow itself was edited). Use:
  #   gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

      - name: Run AGENTS.md rule linter (APAP001/APAP003 + Detectors 2-8)
        # Issue #200, AGENTS.md rule 20 — removing this step is a
        # blocked change. The AST linter (scripts/check_rules.py) is
        # the authoritative APAP001/APAP003 gate: ruff 0.15+ cannot
        # select Python-defined rules, so `ruff check .` above never
        # runs them (see the [tool.ruff.lint] comment in pyproject).
        # Scan the REPO ROOT (`.`), not `app`: Detectors 5-8 resolve
        # app/-relative paths against the scanned root, so passing
        # `app` would silently disable the APAP003/print/CSRF
        # detectors. Default excludes (DEFAULT_EXCLUDES +
        # .check_rulesignore) silence the known false positives.
        # Parity pinned by tests/test_ci_workflow.py::
        # test_ci_workflow_lint_job_runs_check_rules_gate.
        run: python scripts/check_rules.py .

      - name: Run module-size ratchet (AGENTS.md rule 21)
        # Issue #202 — removing this step is a blocked change. The
        # ratchet keeps every module under app/ and migration/ within
        # the 700-line budget; the known offenders live in an explicit
        # BASELINE inside the script that may only shrink. Its own
        # step (separate from check_rules.py) keeps single
        # responsibility: check_rules.py is an AST linter, this is a
        # line-count gate. Pinned by tests/test_module_size.py::
        # test_ci_workflow_lint_job_runs_module_size_gate.
        run: python scripts/check_module_size.py

      - name: Run route-handler size ratchet (AGENTS.md rule 28)
        # Issue #233 — removing this step is a blocked change. Companion
        # to the module-size ratchet above, scoped to individual
        # FastAPI route-handler functions (50-line budget) instead of
        # whole modules; known offenders (animal_foto and 14 siblings)
        # live in an explicit BASELINE that may only shrink. Pinned by
        # tests/test_route_size.py::test_ci_workflow_lint_job_runs_route_size_gate.
        run: python scripts/check_route_size.py

      - name: Diagnostic secret-leak scan
        run: grep -rE '(http://|https://|sk-|ghp_)[A-Za-z0-9]+' .github/ || true

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run mypy (AGENTS.md rule 24)
        # Issue #201 — removing this step is a blocked change. Plain
        # `python -m mypy`: scope (app/ + migration/) and flags live in
        # pyproject.toml [tool.mypy], the single source of truth shared
        # with `make typecheck`, so local and CI runs can never drift.
        # Zero errors is the gate. Pinned by tests/test_ci_workflow.py::
        # test_ci_workflow_defines_typecheck_job_running_mypy.
        run: python -m mypy

  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: apap_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apap_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APAP_TEST_POSTGRES_DSN: postgresql://postgres@127.0.0.1:5432/apap_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run pytest with deprecations as errors
        # --ignore=tests/e2e: the e2e suite uses playwright's sync
        # API, which collides with pytest-asyncio's auto-mode loop
        # resolution under a single pytest run. e2e has its own
        # dedicated job below (with playwright + chromium installed).
        # The job-level PostgreSQL service supplies APAP_TEST_POSTGRES_DSN
        # for tests/test_voluntarios_concurrent.py. APAP_E2E_BASE_URL is
        # intentionally unrelated: it identifies an HTTP server, not a
        # PostgreSQL connection.
        # Coverage flags (issue #199, AGENTS.md rule 19 — removing any
        # of them is a blocked change):
        # --cov=app: measure coverage over the app package.
        # --cov-report=json: write coverage.json, which feeds the
        #   CRITICAL_HELPERS 100% gate (scripts/pytest_plugin/
        #   coverage_gate.py, AGENTS.md rule 11) — the plugin is a
        #   no-op when coverage.json is absent.
        # --cov-fail-under=80: enforce the global floor declared as
        #   fail_under = 80 in pyproject.toml [tool.coverage.report].
        #   Explicit flag because pytest-cov only reliably enforces
        #   the CLI flag, not the config-file value. Parity pinned by
        #   tests/test_ci_workflow.py::
        #   test_ci_workflow_test_job_enforces_global_coverage_floor.
        run: |
          python -m pytest -W error::DeprecationWarning \
            --ignore=tests/e2e \
            --cov=app \
            --cov-report=json \
            --cov-report=term \
            --cov-fail-under=80

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build package
        run: python -m build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: build
    # The e2e suite spins up the FastAPI server and runs Playwright
    # against it. The /login handler returns 503 when Google OAuth env
    # vars are not configured, which makes the e2e tests fail. CI does
    # not provision real OAuth credentials; the e2e suite is meant to
    # run in a configured environment (staging, where APAP_OAUTH_CLIENT_ID
    # is set). Skip the job entirely when the secret is absent.
    if: ${{ vars.APAP_OAUTH_CLIENT_ID != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install Playwright explicitly
        # Install playwright as its own step to avoid cache-staleness
        # races against the dev extra (the e2e job needs playwright on
        # the PATH; relying on a transitive pip install of `[dev]` from a
        # possibly stale cache is fragile).
        run: python -m pip install "playwright>=1.45"

      - name: Install Playwright chromium browser
        run: python -m playwright install --with-deps chromium

      - name: Start APAP_WEB server (no lifespan, no InsForge)
        # The dev server (scripts/dev_server_no_lifespan.py) skips the
        # InsForge bootstrap so the app can start in CI without a real
        # backend. Public HTML routes serve fine; data routes 500
        # (the e2e suite doesn't exercise those).
        run: |
          python scripts/dev_server_no_lifespan.py &
          SERVER_PID=$!
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
            echo "::error::Dev server did not become ready in 30s"
            exit 1
          fi
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"

      - name: Run Playwright E2E suite
        # Skip the suite entirely on branches that don't carry an
        # e2e/ tree (e.g. backend-only PRs like #106 / #107). The
        # e2e harness lives on feat/ui-apap-design-system and lands
        # to staging only when that PR merges.
        if: hashFiles('tests/e2e/**')
        run: python -m pytest tests/e2e/ -v

      - name: Stop dev server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    # Fires on every push to main: PR merges (the normal pre-MVP path per
    # AGENTS.md §15.2) and any direct push both trigger a deploy.
    # The push-event null-check on pull_request was removed — it is always
    # true on push and was masking the real bug (the merge-commit skip block
    # below cancelled every intended deploy).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Install runtime dependencies for the webhook signer
        # ``scripts/coolify_webhook.py`` imports httpx for the actual
        # POST (so the same code path runs in CI tests and production).
        # Without this, the deploy step fails with
        # ``ModuleNotFoundError: No module named 'httpx'`` on a clean
        # ubuntu-latest runner.
        run: python -m pip install httpx itsdangerous

      - name: Diagnostic secret-leak scan
        run: grep -rE '(http://|https://|sk-|ghp_)[A-Za-z0-9]+' . --exclude-dir=.git || true

      - name: Trigger Coolify webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_WEBHOOK_SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Skip if the webhook URL is not configured (deploy is optional
          # in pre-MVC; the operator may deploy manually). Loud fail on
          # missing webhook SECRET — without it the signature cannot be
          # computed and Coolify would 401 the payload silently.
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "::notice::COOLIFY_WEBHOOK_URL secret is not configured. Skipping deploy step. Set it in Settings → Secrets → Actions to enable automatic deploys."
            exit 0
          fi
          if [ -z "$COOLIFY_WEBHOOK_SECRET" ]; then
            echo "::error::COOLIFY_WEBHOOK_SECRET secret is not configured. Set it in Settings → Secrets → Actions before merging to main."
            exit 1
          fi

          # Delegate the HMAC signing + POST to a unit-tested module.
          # Production and test paths share the same code (pinned by
          # tests/test_coolify_webhook.py).
          python scripts/coolify_webhook.py
