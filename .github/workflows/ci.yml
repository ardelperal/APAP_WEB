name: ci

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

      - name: Diagnostic secret-leak scan
        run: grep -rE '(http://|https://|sk-|ghp_)[A-Za-z0-9]+' .github/ || true

  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run pytest with deprecations as errors
        run: python -m pytest -W error::DeprecationWarning

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build package
        run: python -m build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
          cache: pip

      - name: Install development dependencies (includes playwright)
        run: python -m pip install -e ".[dev]"

      - name: Install Playwright chromium browser
        run: python -m playwright install --with-deps chromium

      - name: Start APAP_WEB server (no lifespan, no InsForge)
        # The dev server (scripts/dev_server_no_lifespan.py) skips the
        # InsForge bootstrap so the app can start in CI without a real
        # backend. Public HTML routes serve fine; data routes 500
        # (the e2e suite doesn't exercise those).
        run: |
          python scripts/dev_server_no_lifespan.py &
          SERVER_PID=$!
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
            echo "::error::Dev server did not become ready in 30s"
            exit 1
          fi
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"

      - name: Run Playwright E2E suite
        run: python -m pytest tests/e2e/ -v

      - name: Stop dev server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.pull_request == null
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Diagnostic secret-leak scan
        run: grep -rE '(http://|https://|sk-|ghp_)[A-Za-z0-9]+' . --exclude-dir=.git || true

      - name: Trigger Coolify webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          # Skip on merge commits: a push triggered by merging a pull request
          # is not a real "deploy this change" event. Only direct pushes count.
          commit_msg="$(git log -1 --pretty=%B)"
          if echo "$commit_msg" | grep -q "^Merge pull request #"; then
            echo "Skipping deploy: this is a merge commit, not a direct push."
            exit 0
          fi
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "::error::COOLIFY_WEBHOOK_URL secret is not configured. Set it in Settings → Secrets → Actions before merging to main."
            exit 1
          fi
          curl -fsS -X POST "$COOLIFY_WEBHOOK_URL"
