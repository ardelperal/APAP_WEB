name: e2e (self-hosted)

# Dedicated e2e workflow targeting the Oracle ARM64 self-hosted runner.
# This workflow is the primary e2e pipeline when APAP_SELF_HOSTED_E2E_ENABLED
# is set on the repository. The conditional `runs-on` in ci.yml's e2e job
# falls back to ubuntu-latest when that variable is absent; this workflow
# only runs on the self-hosted runner and is skipped otherwise.
#
# Issue #223: https://github.com/ardelperal/APAP_WEB/issues/223
# Runner provisioning: docs/runbooks/github-runner-registration.md

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to run e2e against (default: main)"
        required: false
        default: ""
  schedule:
    # Smoke-test the self-hosted runner weekly so it stays warm and
    # online. Runners that go offline for >7 days are automatically
    # removed by GitHub.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  e2e-self-hosted:
    name: e2e (self-hosted)
    # Require the exact label set provisioned per docs/runbooks/github-runner-registration.md
    runs-on: [self-hosted, Linux, ARM64, apap, oracle]
    # Skip entirely when APAP_OAUTH_CLIENT_ID is not configured — same guard
    # as ci.yml's e2e job. Also gate on the explicit self-hosted flag so
    # this workflow is never confused with ubuntu-latest runs.
    if: ${{ vars.APAP_OAUTH_CLIENT_ID != '' && vars.APAP_SELF_HOSTED_E2E_ENABLED != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install Playwright explicitly
        run: python -m pip install "playwright>=1.45"

      - name: Install Playwright chromium browser
        run: python -m playwright install --with-deps chromium

      - name: Start APAP_WEB server (no lifespan, no InsForge)
        run: |
          python scripts/dev_server_no_lifespan.py &
          SERVER_PID=$!
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
            echo "::error::Dev server did not become ready in 30s"
            exit 1
          fi
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"

      - name: Run Playwright E2E suite
        if: hashFiles('tests/e2e/**')
        run: python -m pytest tests/e2e/ -v

      - name: Stop dev server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true
