name: pr-size
on:
  # Issue #890: this direct trigger now covers ONLY label changes. Every
  # other pull_request type (opened/synchronize/reopened) — plus push to
  # staging/tags and workflow_dispatch — routes through ci.yml's own
  # pull_request trigger, whose first job calls this workflow via
  # `uses:` instead of reimplementing the same computation. Two workflows
  # publishing a check named `pr-size` for the same event was exactly the
  # ambiguous-status-check shape GitHub's own docs warn about (and that
  # forced `--admin` merges while both existed side by side) — this split
  # keeps exactly one publisher per event instead of a second copy of the
  # logic that can drift out of sync with this one.
  pull_request:
    types: [labeled, unlabeled]
  workflow_call:
# Issue #890: hardcoded "pr-size" literal instead of `${{ github.workflow
# }}` (see ci.yml for the general cancel-in-progress rationale, issue
# #530). This workflow is now invoked two ways — directly
# (labeled/unlabeled) and via workflow_call from ci.yml — and
# `${{ github.workflow }}` inside a called reusable workflow can resolve
# to the CALLER's name ("ci"), which would collide with ci.yml's own
# top-level concurrency group of the same shape and self-cancel the call
# before it ever produces a job.
#
# Issue #926: the two invocation paths used to share this exact group, so
# every `labeled`/`unlabeled` event (e.g. `gh pr create --label`) cancelled
# the workflow_call run in progress inside `ci`, leaving `ci / required`
# red without ever running the dependent jobs. Inside a called reusable
# workflow the `github` context is the CALLER's: `github.event_name` is
# `pull_request` and `github.event.action` is `opened`/`synchronize`/
# `reopened` there, while a direct run always has action `labeled` or
# `unlabeled`. The suffix below routes on that difference so a label event
# only cancels other label events, and a ci call only cancels an older ci
# call — #530's stale-run cancellation stays intact on each path
# independently, and #890's single-publisher-per-event guarantee is
# unaffected since the suffix never changes which workflow publishes the
# `pr-size` check for a given event.
concurrency:
  group: pr-size-${{ github.ref }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'label' || 'call' }}
  cancel-in-progress: true
# The job below reads the repository (merge-base diff) and, since issue
# #926, the PR's live labels via the GitHub API; it never writes back.
# Match the explicit permissions contract of ci.yml / deploy.yml so a
# future repo-level default that broadens the GITHUB_TOKEN does not
# silently widen this workflow's blast radius (issue #682).
#
# Issue #926: `issues: read` was added so the "Check size:exception label"
# step below can fetch the PR's current labels from the GitHub API instead
# of trusting the (possibly stale) pull_request event payload.
permissions:
  contents: read
  issues: read

jobs:
  pr-size:
    name: pr-size
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The merge-base diff below needs the full history, not a shallow clone.
          fetch-depth: 0

      # The GitHub-hosted image came with a Python. This runner image does not,
      # so every `python scripts/...` here exited 127 the moment the job moved.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.11"

      - name: Compute diff against merge-base
        id: diff
        # Issue #525: the comparison base must come from the event's
        # ``github.base_ref``, not the hardcoded ``origin/main``. A
        # chained or stacked PR whose base is a feature branch used
        # to inherit the base PR's diff on top of its own (a #524 PR
        # showed 329 actual / 634 reported). The fix fetches the named
        # ref into the runner (the events payload carries only the
        # head SHA, not the base ref), then computes the merge-base
        # against the fetched ref with the value quoted to handle
        # branch names carrying shell metacharacters. Empty or
        # unresolvable ref fails loudly instead of falling back to
        # main — quiet fallback is exactly the regression this step
        # is meant to catch.
        #
        # Issue #890: this job is now also invoked via `workflow_call`
        # from ci.yml's own pull_request trigger, and from ci.yml's push
        # (staging/tags) and workflow_dispatch triggers, none of which
        # carry a PR base ref. Only fail loudly when the triggering event
        # actually is a pull_request; every other event has nothing to
        # diff against and reports 0, same as ci.yml's own fallback did
        # before this consolidation.
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "total=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_REF" ]; then
            echo "::error::BASE_REF is empty; \${{ github.base_ref }} was not provided."
            exit 1
          fi
          # NOT --depth=1. A shallow fetch marks the WHOLE repository shallow,
          # and then `merge-base` can only see back as far as the boundary. On a
          # PR against main that boundary usually still contains the common
          # ancestor, so it passes — but on a CHAINED PR, the case this step
          # exists for, the ancestor is further back and merge-base returns
          # nothing. The step would fail exactly where it is needed. Verified:
          # `git fetch --depth=1` flips `rev-parse --is-shallow-repository` to
          # true on a complete clone.
          #
          # The checkout above already used fetch-depth: 0, which populates
          # refs/remotes/origin/* for every branch, so origin/$BASE_REF normally
          # exists before this runs. This fetch only covers a base branch created
          # after the checkout, and must stay unshallow to be harmless.
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          if [ -z "$BASE" ]; then
            echo "::error::merge-base origin/$BASE_REF HEAD produced no SHA."
            exit 1
          fi
          # Generated lockfiles are deterministic machine output, not useful
          # review-budget lines. Their source manifests remain counted.
          DIFF_PATHS=(. ':(exclude)**/package-lock.json' ':(exclude)uv.lock')
          ADDED=$(git diff --shortstat "$BASE"...HEAD -- "${DIFF_PATHS[@]}" | awk '{print $4}')
          DELETED=$(git diff --shortstat "$BASE"...HEAD -- "${DIFF_PATHS[@]}" | awk '{print $6}')
          if [ -z "$ADDED" ]; then ADDED=0; fi
          if [ -z "$DELETED" ]; then DELETED=0; fi
          TOTAL=$((ADDED + DELETED))
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}

      - name: Check size:exception label via the GitHub API
        id: labels
        # Issue #926: the triggering event's own PR-labels snapshot only
        # reflects what was present the moment that event fired.
        # `gh pr create --label` applies labels AFTER creation, so an
        # `opened` payload has none, and `gh run rerun` replays that same
        # original payload — both left a PR carrying `size:exception`
        # failing the gate (PR #931, run 36046072242: HAS_EXCEPTION=false
        # with the label present). Read the live labels instead. Only
        # pull_request-shaped events have a PR to query; every other
        # trigger (push, workflow_dispatch) has nothing to check and
        # TOTAL=0 already passes regardless.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Issue #533: this runner does not provide the `gh` CLI — curl +
          # jq, both present, replace it (same pattern as deploy.yml's
          # "Find the green CI run that proved this tree" step).
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels?per_page=100")
          # Fail CLOSED: a failed lookup must not be silently read as "no
          # size:exception label", which would let an oversized PR through
          # the budget gate instead of blocking it.
          if [ "$code" != "200" ]; then
            echo "::error::Failed to fetch labels for PR #$PR_NUMBER from the GitHub API (HTTP ${code}); failing closed instead of assuming size:exception is absent (issue #926)."
            exit 1
          fi
          HAS_EXCEPTION=$(jq 'any(.[]; .name == "size:exception")' "$body")
          echo "has_exception=$HAS_EXCEPTION" >> "$GITHUB_OUTPUT"

      - name: Enforce 400-line budget (AGENTS.md §15.1)
        env:
          TOTAL: ${{ steps.diff.outputs.total }}
          HAS_EXCEPTION: ${{ steps.labels.outputs.has_exception == 'true' }}
        run: python scripts/check_pr_size.py "$TOTAL" "$HAS_EXCEPTION"
