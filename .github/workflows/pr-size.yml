name: pr-size
on:
  pull_request:
# See ci.yml for the cancel-in-progress rationale (issue #530).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pr-size:
    name: pr-size
    runs-on: [self-hosted, Linux, ARM64, apap, oracle, coolify, noble]
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # The merge-base diff below needs the full history, not a shallow clone.
          fetch-depth: 0

      # The GitHub-hosted image came with a Python. This runner image does not,
      # so every `python scripts/...` here exited 127 the moment the job moved.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.11"

      - name: Compute diff against merge-base
        id: diff
        # Issue #525: the comparison base must come from the event's
        # ``github.base_ref``, not the hardcoded ``origin/main``. A
        # chained or stacked PR whose base is a feature branch used
        # to inherit the base PR's diff on top of its own (a #524 PR
        # showed 329 actual / 634 reported). The fix fetches the named
        # ref into the runner (the events payload carries only the
        # head SHA, not the base ref), then computes the merge-base
        # against the fetched ref with the value quoted to handle
        # branch names carrying shell metacharacters. Empty or
        # unresolvable ref fails loudly instead of falling back to
        # main — quiet fallback is exactly the regression this step
        # is meant to catch.
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "::error::BASE_REF is empty; \${{ github.base_ref }} was not provided."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          if [ -z "$BASE" ]; then
            echo "::error::merge-base origin/$BASE_REF HEAD produced no SHA."
            exit 1
          fi
          ADDED=$(git diff --shortstat "$BASE"...HEAD | awk '{print $4}')
          DELETED=$(git diff --shortstat "$BASE"...HEAD | awk '{print $6}')
          if [ -z "$ADDED" ]; then ADDED=0; fi
          if [ -z "$DELETED" ]; then DELETED=0; fi
          TOTAL=$((ADDED + DELETED))
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Enforce 400-line budget (AGENTS.md §15.1)
        env:
          TOTAL: ${{ steps.diff.outputs.total }}
          # Use contains() on the joined label names string. The previous
          # expression `contains(github.event.pull_request.labels.*.name, 'size:exception')`
          # returned "false" in CI for unknown reasons; the joined-string form
          # is reliable across runners.
          HAS_EXCEPTION: ${{ join(github.event.pull_request.labels.*.name, ',') == 'size:exception' || contains(join(github.event.pull_request.labels.*.name, ','), 'size:exception') }}
        run: python scripts/check_pr_size.py "$TOTAL" "$HAS_EXCEPTION"