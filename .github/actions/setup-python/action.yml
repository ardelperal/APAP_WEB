name: Set up locked Python environment
description: Install the repository's exact Python and frozen uv environment.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version-file: .python-version

    - name: Install pinned uv
      shell: bash
      run: python -m pip install --disable-pip-version-check "uv==0.9.28"

    # Issue #938: dependencies are installed by `uv sync`, not pip, so the
    # cache has to hold uv's package cache. The key changes with uv.lock and
    # the Python version, so a lockfile bump never reuses stale packages;
    # `uv sync --frozen` below still fails if uv.lock is out of date.
    - name: Point uv at a cacheable directory
      shell: bash
      run: echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "$GITHUB_ENV"

    - name: Restore uv package cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/uv-cache
        key: uv-${{ runner.os }}-${{ hashFiles('.python-version') }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-${{ hashFiles('.python-version') }}-

    - name: Synchronize frozen development environment
      shell: bash
      run: |
        set -euo pipefail
        uv sync --frozen --extra dev
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
