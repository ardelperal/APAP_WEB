name: Set up locked Python environment
description: Install the repository's exact Python and frozen uv environment.

runs:
  using: composite
  steps:
    - name: Set up Python
      # Issue #1087: v7.0.0 SHA shared with every inline workflow step so a
      # Dependabot bump cannot leave this composite action behind.
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version-file: .python-version

    - name: Install pinned uv
      shell: bash
      run: python -m pip install --disable-pip-version-check "uv==0.9.28"

    - name: Synchronize frozen development environment
      shell: bash
      run: |
        set -euo pipefail
        uv sync --frozen --extra dev
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
