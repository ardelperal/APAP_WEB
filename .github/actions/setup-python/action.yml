name: Set up locked Python environment
description: Install the repository's exact Python and frozen uv environment.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version-file: .python-version
        cache: pip

    - name: Install pinned uv
      shell: bash
      run: python -m pip install --disable-pip-version-check "uv==0.9.28"

    - name: Synchronize frozen development environment
      shell: bash
      run: |
        set -euo pipefail
        uv sync --frozen --extra dev
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
