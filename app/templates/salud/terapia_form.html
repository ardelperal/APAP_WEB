<!DOCTYPE html>
<html>
<head><title>{{ form_action }}</title></head>
<body>
{% if error %}<p style="color:red">{{ error }}</p>{% endif %}
<form method="post" action="{{ form_action }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Animal ID <input name="animal_id" value="{{ form_data.animal_id }}"></label>
  <label>Voluntario ID <input name="voluntario_id" value="{{ form_data.voluntario_id }}"></label>
  <label>Fecha <input name="fecha" value="{{ form_data.fecha }}"></label>
  <label>Descripción <textarea name="descripcion">{{ form_data.descripcion }}</textarea></label>
  <button type="submit">Guardar</button>
</form>
</body>
</html>
