{% extends "base.html" %}
{% block title %}{{ "Editar" if form_data.NCHIP else "Nuevo" }} animal - APAP_WEB{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-6">
        {{ "Editar animal" if form_data.NCHIP else "Nuevo animal" }}
    </h1>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded mb-6">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" action="" class="bg-white shadow rounded-lg p-6 space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">NCHIP *</label>
                <input type="text" name="NCHIP" value="{{ form_data.NCHIP or '' }}"
                       class="mt-1 block w-full border border-gray-300 rounded px-3 py-2"
                       required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Nombre *</label>
                <input type="text" name="NombreAnimal" value="{{ form_data.NombreAnimal or '' }}"
                       class="mt-1 block w-full border border-gray-300 rounded px-3 py-2"
                       required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Especie *</label>
                <select name="Especie" class="mt-1 block w-full border border-gray-300 rounded px-3 py-2" required>
                    {% for esp in especies %}
                    <option value="{{ esp }}" {% if form_data.Especie == esp %}selected{% endif %}>{{ esp }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Sexo *</label>
                <select name="Sexo" class="mt-1 block w-full border border-gray-300 rounded px-3 py-2" required>
                    {% for sx in sexos %}
                    <option value="{{ sx }}" {% if form_data.Sexo == sx %}selected{% endif %}>{{ sx }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">FNacimiento *</label>
                <input type="date" name="FNacimiento" value="{{ form_data.FNacimiento or '' }}"
                       class="mt-1 block w-full border border-gray-300 rounded px-3 py-2"
                       required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Raza</label>
                <input type="text" name="Raza" value="{{ form_data.Raza or '' }}"
                       class="mt-1 block w-full border border-gray-300 rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Color</label>
                <input type="text" name="Color" value="{{ form_data.Color or '' }}"
                       class="mt-1 block w-full border border-gray-300 rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Pelo</label>
                <input type="text" name="Pelo" value="{{ form_data.Pelo or '' }}"
                       class="mt-1 block w-full border border-gray-300 rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Tamano</label>
                <input type="text" name="Tamano" value="{{ form_data.Tamano or '' }}"
                       class="mt-1 block w-full border border-gray-300 rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Caracter</label>
                <input type="text" name="Caracter" value="{{ form_data.Caracter or '' }}"
                       class="mt-1 block w-full border border-gray-300 rounded px-3 py-2">
            </div>
        </div>

        <details class="border rounded p-3 bg-gray-50">
            <summary class="cursor-pointer font-medium text-gray-700">Campos opcionales (legacy)</summary>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">TraeNChip</label>
                    <input type="text" name="TraeNChip" value="{{ form_data.TraeNChip or '' }}"
                           class="mt-1 block w-full border border-gray-300 rounded px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">FIMPLANTACIONCHIP</label>
                    <input type="date" name="FIMPLANTACIONCHIP" value="{{ form_data.FIMPLANTACIONCHIP or '' }}"
                           class="mt-1 block w-full border border-gray-300 rounded px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">FDefuncion</label>
                    <input type="date" name="FDefuncion" value="{{ form_data.FDefuncion or '' }}"
                           class="mt-1 block w-full border border-gray-300 rounded px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Terapia</label>
                    <input type="text" name="Terapia" value="{{ form_data.Terapia or '' }}"
                           class="mt-1 block w-full border border-gray-300 rounded px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Eutanasia</label>
                    <input type="text" name="Eutanasia" value="{{ form_data.Eutanasia or '' }}"
                           class="mt-1 block w-full border border-gray-300 rounded px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Mestizo</label>
                    <input type="text" name="Mestizo" value="{{ form_data.Mestizo or '' }}"
                           class="mt-1 block w-full border border-gray-300 rounded px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">RazaPPP</label>
                    <input type="text" name="RazaPPP" value="{{ form_data.RazaPPP or '' }}"
                           class="mt-1 block w-full border border-gray-300 rounded px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Cartilla</label>
                    <input type="text" name="Cartilla" value="{{ form_data.Cartilla or '' }}"
                           class="mt-1 block w-full border border-gray-300 rounded px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">NombreFoto</label>
                    <input type="text" name="NombreFoto" value="{{ form_data.NombreFoto or '' }}"
                           class="mt-1 block w-full border border-gray-300 rounded px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">ComunicacionARIAC</label>
                    <input type="text" name="ComunicacionARIAC" value="{{ form_data.ComunicacionARIAC or '' }}"
                           class="mt-1 block w-full border border-gray-300 rounded px-3 py-2">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700">Observaciones</label>
                    <textarea name="Observaciones" rows="2"
                              class="mt-1 block w-full border border-gray-300 rounded px-3 py-2">{{ form_data.Observaciones or '' }}</textarea>
                </div>
            </div>
        </details>

        <div class="flex justify-end gap-3 pt-4">
            <a href="/animales" class="px-4 py-2 text-gray-700 hover:text-gray-900">Cancelar</a>
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
                Guardar
            </button>
        </div>
    </form>
</div>
{% endblock %}
