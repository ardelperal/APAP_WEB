version: "1.0"

# Mapeo de la tabla web `animales` ↔ legacy `TbFichaAnimal` (Access).
# Esta es la tabla principal del ciclo LIFECYCLE (animal master record).
# La columna NCHIP es el natural key compartido entre web y legacy: se
# preserva como string (no se hashea) para que el round-trip test
# (#13474 v2) pueda comparar fila por fila sin un mapping auxiliar.
web_table: animales
legacy_table: TbFichaAnimal
key_field: NCHIP
legacy_key: NCHIP

# Fechas legacy candidatas para detectar conflictos modified_both_sides
# (regla #13475 v2). FIMPLANTACIONCHIP es cuándo se le puso el chip;
# FDefuncion es cuándo falleció. El diff engine toma max() de las que
# estén no-NULL y compara contra el last_sync_at del sync_state.
date_fields:
  - FIMPLANTACIONCHIP
  - FDefuncion

columns:
  # --- Heredadas 1:1 (snake_case web, CamelCase legacy) ---
# El schema web usa snake_case (eutanasia_otras_causas, etc.). El mapping
# en web_column usa el nombre del schema web, NO el del legacy.
# legacy_column preserva el CamelCase del .accdb. Sin esta distinción
# el INSERT contra la DB falla con "column does not exist" porque
# Postgres trata los identificadores sin quotes como lowercase
# aplastado, no como snake_case (issue #638).
  - { web_column: NCHIP, legacy_column: NCHIP, transform: identity, nullable: false }
  - { web_column: TraeNChip, legacy_column: TraeNChip, transform: normalize_si_no, nullable: true }
  - { web_column: FIMPLANTACIONCHIP, legacy_column: FIMPLANTACIONCHIP, transform: nullify_empty_string, nullable: true }
  - { web_column: NombreAnimal, legacy_column: NombreAnimal, transform: identity, nullable: false }
  - { web_column: Especie, legacy_column: Especie, transform: normalize_especie, nullable: false }
  - { web_column: Sexo, legacy_column: Sexo, transform: normalize_sexo, nullable: false }
  - { web_column: Raza, legacy_column: Raza, transform: identity, nullable: true }
  - { web_column: Color, legacy_column: Color, transform: identity, nullable: true }
  - { web_column: Pelo, legacy_column: Pelo, transform: identity, nullable: true }
  - { web_column: Tamano, legacy_column: Tamanyos, transform: identity, nullable: true }
  - { web_column: Caracter, legacy_column: Caracter, transform: identity, nullable: true }
  - { web_column: FNacimiento, legacy_column: FNacimiento, transform: nullify_empty_string, nullable: false }
  - { web_column: FDefuncion, legacy_column: FDefuncion, transform: nullify_empty_string, nullable: true }
  - { web_column: Terapia, legacy_column: Terapia, transform: normalize_si_no, nullable: true }
  - { web_column: Observaciones, legacy_column: Observaciones, transform: identity, nullable: true }
  - { web_column: NombreFoto, legacy_column: NombreFoto, transform: identity, nullable: true }
  - { web_column: Cartilla, legacy_column: Cartilla, transform: normalize_si_no, nullable: true }
  - { web_column: Eutanasia, legacy_column: Eutanasia, transform: normalize_si_no, nullable: true }
  - { web_column: RazaPPP, legacy_column: RazaPPP, transform: normalize_si_no, nullable: true }
  - { web_column: Mestizo, legacy_column: Mestizo, transform: normalize_si_no, nullable: true }
  - { web_column: eutanasia_otras_causas, legacy_column: EutanasiaOtrasCausas, transform: nullify_empty_string, nullable: true }
  - { web_column: eutanasia_enfermedad, legacy_column: EutanasiaEnfermedad, transform: nullify_empty_string, nullable: true }
  - { web_column: ultimo_estado_antes_de_fallecido, legacy_column: UltimoEstadoAntesDeFallecido, transform: nullify_empty_string, nullable: true }
  - { web_column: comunicacionariac, legacy_column: ComunicacionARIAC, transform: identity, nullable: true }

  # --- Web-only (greenfield) ---
  # id, fecha_alta, updated_at, activo son columnas que solo existen en
  # la web. legacy_column=null le dice al applier: en sentido
  # web→legacy, no incluir en la query (regla #13454 v2: schema web
  # libre, no se fuerzan renames al legacy).
  #
  # Estrategia web_only (PR 3 / web-only-feature-preservation §3.4):
  #   - id:           transform=default_uuid  → EXENTA (UUID mecánico)
  #   - fecha_alta:   transform=default_now    → EXENTA (timestamp web)
  #   - updated_at:   transform=default_now    → EXENTA (timestamp web)
  #   - activo:       strategy=fixed            (web owns el soft-delete;
  #                                              shadow-state NO lo reconcilia)
  #   - current_state: strategy=derived          (PR6 / M2 reverse:
  #                                              web-only column whose
  #                                              value is produced by the
  #                                              derivation engine; on
  #                                              reverse apply the
  #                                              applier observes a
  #                                              post-forward override
  #                                              and emits a
  #                                              LIFECYCLE_REVERSED
  #                                              event WITHOUT
  #                                              re-deriving — design §1
  #                                              Decision 11). The
  #                                              forward applier still
  #                                              owns the derivation
  #                                              engine call (PR3+).
  - { web_column: id, transform: default_uuid, nullable: false }
  - { web_column: fecha_alta, transform: default_now, nullable: false }
  - { web_column: updated_at, transform: default_now, nullable: false }
  - { web_column: activo, transform: default_true, nullable: false, web_only_strategy: fixed }
  - { web_column: current_state, transform: identity, nullable: true, web_only_strategy: derived }

fk_lookups: []
