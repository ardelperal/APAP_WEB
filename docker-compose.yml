# docker-compose.yml — M0 of self-host-backend-coolify (issue #641)
#
# Spins up the full local stack: postgres + MinIO + web app.
# The local backend (app/core/local_backend/app.py) is spawned
# automatically by `verify-fallback-ready --ci-only` when
# APAP_LOCAL_DB_URL is set (see migration/verify_fallback_ready.py §M0 wiring).
#
# Usage:
#   cp env.example .env  # fill in APAP_SESSION_SECRET,
#                        # APAP_INITIAL_ADMIN_EMAIL, APAP_DB_PASSWORD,
#                        # APAP_S3_ACCESS_KEY, APAP_S3_SECRET_KEY, APAP_S3_BUCKET
#   docker compose up --build
#
# Health-checked services: postgres (port 5434→5432), minio (port 9000),
# web (port 8001→8000).

services:
  postgres:
    image: postgres:16-alpine
    container_name: apap-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apap -d apap"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: apap
      POSTGRES_PASSWORD: ${APAP_DB_PASSWORD:?APAP_DB_PASSWORD is required}
      POSTGRES_DB: apap
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apap-net
    ports:
      - "5434:5432"

  minio:
    image: minio/minio:latest
    container_name: apap-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      MINIO_ROOT_USER: ${APAP_S3_ACCESS_KEY:?APAP_S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${APAP_S3_SECRET_KEY:?APAP_S3_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    networks:
      - apap-net
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console (optional, for debugging)

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apap-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      # Direct Postgres connection (the web app uses LocalPostgresExecutor,
      # not the HTTP local-backend router).
      APAP_LOCAL_DB_URL: postgresql://apap:${APAP_DB_PASSWORD:?}@postgres:5432/apap
      APAP_SESSION_SECRET: ${APAP_SESSION_SECRET:?APAP_SESSION_SECRET is required}
      # Bootstrap admin — create the first developer account on first boot.
      APAP_INITIAL_ADMIN_EMAIL: ${APAP_INITIAL_ADMIN_EMAIL:?APAP_INITIAL_ADMIN_EMAIL is required}
      APAP_BUILD_SHA: ${APAP_GIT_SHA:-$(git rev-parse --short HEAD 2>/dev/null || echo 'dev')}
      # MinIO / S3-compatible storage.
      # Without these, the app boots normally but photo downloads return
      # the placeholder PNG.
      APAP_S3_ENDPOINT: minio:9000
      APAP_S3_ACCESS_KEY: ${APAP_S3_ACCESS_KEY:?APAP_S3_ACCESS_KEY is required}
      APAP_S3_SECRET_KEY: ${APAP_S3_SECRET_KEY:?APAP_S3_SECRET_KEY is required}
      APAP_S3_BUCKET: ${APAP_S3_BUCKET:-apap-photos}
      APAP_S3_SECURE: "false"
      # OAuth (optional for M0 — the hardcoded local OAuth stub works without it).
      # Uncomment and fill in for real Google OAuth:
      # APAP_GOOGLE_CLIENT_ID: your-client-id
      # APAP_GOOGLE_CLIENT_SECRET: your-client-secret
      # APAP_PUBLIC_BASE_URL: https://your-public-url
    networks:
      - apap-net
    ports:
      - "8001:8000"

networks:
  apap-net:
    driver: bridge

volumes:
  postgres_data:
    name: apap-postgres-data
  minio_data:
    name: apap-minio-data
