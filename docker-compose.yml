# docker-compose.yml — M0 of self-host-backend-coolify (issue #641)
#
# Spins up the local stack: postgres + web app. MinIO is not part of the
# local compose (the app boots without S3 and photo downloads return the
# placeholder PNG); point APAP_S3_* at an external bucket if needed.
# The local backend (app/core/local_backend/app.py) is spawned
# automatically by `verify-fallback-ready --ci-only` when
# APAP_LOCAL_DB_URL is set (see migration/verify_fallback_ready.py §M0 wiring).
#
# Usage:
#   cp env.example .env  # fill in APAP_SESSION_SECRET,
#                        # APAP_INITIAL_ADMIN_EMAIL, APAP_DB_PASSWORD
#   docker compose up --build
#
# Health-checked services: postgres (port 5434→5432), web (port 8001→8000).

services:
  postgres:
    image: postgres:16-alpine
    container_name: apap-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apap -d apap"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: apap
      POSTGRES_PASSWORD: ${APAP_DB_PASSWORD:?APAP_DB_PASSWORD is required}
      POSTGRES_DB: apap
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apap-net
    ports:
      - "5434:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apap-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      # Direct Postgres connection (the web app uses LocalPostgresExecutor,
      # not the HTTP local-backend router).
      APAP_LOCAL_DB_URL: postgresql://apap:${APAP_DB_PASSWORD:?}@postgres:5432/apap
      APAP_SESSION_SECRET: ${APAP_SESSION_SECRET:?APAP_SESSION_SECRET is required}
      # Bootstrap admin — create the first developer account on first boot.
      APAP_INITIAL_ADMIN_EMAIL: ${APAP_INITIAL_ADMIN_EMAIL:?APAP_INITIAL_ADMIN_EMAIL is required}
      # Compose does not run shell commands during interpolation, so the
      # revision must be injected by the caller (CI/CD exports APAP_GIT_SHA).
      # Without it /healthz reports the literal fallback "dev".
      APAP_BUILD_SHA: ${APAP_GIT_SHA:-dev}
      # MinIO / S3-compatible storage (external bucket; not part of this
      # compose). The app boots without these and photo downloads return
      # the placeholder PNG; uncomment the endpoint to attach one.
#      APAP_S3_ENDPOINT: minio:9000
      APAP_S3_ACCESS_KEY: ${APAP_S3_ACCESS_KEY:-}
      APAP_S3_SECRET_KEY: ${APAP_S3_SECRET_KEY:-}
      APAP_S3_BUCKET: ${APAP_S3_BUCKET:-apap-photos}
      APAP_S3_SECURE: "false"
      # OAuth (optional for M0 — the hardcoded local OAuth stub works without it).
      # Uncomment and fill in for real Google OAuth:
      # APAP_GOOGLE_CLIENT_ID: your-client-id
      # APAP_GOOGLE_CLIENT_SECRET: your-client-secret
      # APAP_PUBLIC_BASE_URL: https://your-public-url
    networks:
      - apap-net
    ports:
      - "8001:8000"

networks:
  apap-net:
    driver: bridge

volumes:
  postgres_data:
    name: apap-postgres-data
