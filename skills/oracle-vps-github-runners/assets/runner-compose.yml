# Coolify service compose for one GitHub Actions self-hosted runner on the Oracle VPS.
#
# Placeholders to replace:
#   <SLUG>      short project slug, unique per runner   e.g. apap, a2w, planhub
#   <N>         instance number, 1 for the first runner e.g. 1
#   <OWNER>/<REPO>  target repository                   e.g. ardelperal/APAP_WEB
#   <LABELS>    matching labels, IDENTICAL across every runner of the same pool
#
# Set ACCESS_TOKEN as a Coolify env var on the service (a PAT with `repo` scope).
# Do NOT put a RUNNER_TOKEN anywhere: see references/failure-modes.md, FM-1.
#
# Verified working on vinc-ardelperal (aarch64, Docker 29.6.2) 2026-08-11.

services:
  github-runner:
    image: 'ghcr.io/actions/actions-runner:latest'
    container_name: <SLUG>-github-runner-<N>
    restart: unless-stopped
    user: root
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - RUNNER_NAME=<SLUG>-runner-<N>
      - 'REPO_URL=https://github.com/<OWNER>/<REPO>'
      - REPO_PATH=<OWNER>/<REPO>
      - 'ACCESS_TOKEN=${ACCESS_TOKEN}'
      - 'RUNNER_LABELS=<LABELS>'
      - RUNNER_ALLOW_RUNASROOT=true
      # One _work path PER RUNNER. Never share it between instances.
      - RUNNER_WORK=/data/runners/<SLUG>-<N>/_work
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      # Same path inside and outside the container, so `docker run -v "$PWD:/repo"`
      # inside a job resolves against the host daemon. Without this, scanners
      # mount an empty directory and report a clean tree.
      - '/data/runners/<SLUG>-<N>/_work:/data/runners/<SLUG>-<N>/_work'
    command:
      - /bin/bash
      - '-c'
      - |
        set -u
        # A GitHub runner REGISTRATION token expires one hour after it is issued.
        # Passing a static one in RUNNER_TOKEN makes the container unable to
        # register on any later restart: it returns offline and jobs queue
        # forever against a listener that never appears. Mint a fresh token from
        # the long-lived ACCESS_TOKEN on every start instead, so restarting is a
        # recovery path rather than a way to destroy the runner.
        TOKEN="$$(curl -sf -X POST \
          -H "Authorization: Bearer $$ACCESS_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$$REPO_PATH/actions/runners/registration-token" \
          | grep -o '"token": *"[^"]*"' | head -1 | cut -d'"' -f4)"
        if [ -z "$$TOKEN" ]; then
          echo "FATAL: could not mint a registration token for $$REPO_PATH from ACCESS_TOKEN" >&2
          exit 1
        fi
        /home/runner/config.sh \
          --token "$$TOKEN" \
          --url "$$REPO_URL" \
          --labels "$$RUNNER_LABELS" \
          --name "$$RUNNER_NAME" \
          --work "$$RUNNER_WORK" \
          --unattended --replace
        exec /home/runner/run.sh
    healthcheck:
      test:
        - CMD-SHELL
        - "ps -ef | grep -v grep | grep -q '[R]unner.Listener' && curl -sf --max-time 10 https://api.github.com/zen >/dev/null || exit 1"
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
