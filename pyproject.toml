[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apap-web"
version = "0.1.0"
description = "APAP — Registro de Protectoras de Animales de Alcalá (web application)"
readme = "docs/setup.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "APAP Engineering" }]
keywords = ["apap", "animal-shelter", "fastapi", "htmx", "insforge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Database",
]

# Runtime dependencies for the APAP_WEB application skeleton (Fase 1).
# Pinned per docs/architecture-insforge-stack.md § Stack.
#
# Note: the ETL one-time (reconcile, diff_engine, mappings/*.yaml,
# shadow_state, lock, etc.) was moved to the top-level ``migration/``
# package on 2026-06-28. That package is NOT shipped in the production
# wheel (see [tool.hatch.build.targets.wheel] only-include below) and
# has its own deps (pyyaml, psutil) declared in [project.optional-dependencies].
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "psycopg[binary]>=3.3",
    # E2E: UI verification via real Chromium browser. CI installs the
    # chromium binary separately with `playwright install chromium`.
    "playwright>=1.45",
    # Type checking gate (issue #201, AGENTS.md rule 24). Scope and
    # flags live in [tool.mypy] below; run with `make typecheck` or
    # `python -m mypy`. >=2.3 = version validated locally (mypy 2.3.0).
    "mypy>=2.3",
    # Stub packages for the migration/ scope: psutil and pyyaml are
    # [etl]-only runtime deps, but mypy needs their stubs at check time
    # even on machines that never install the etl extra.
    "types-psutil>=7.0",
    "types-PyYAML>=6.0",
]
# ETL one-time: only operator machines that run ``python -m migration``
# need these. Installed with ``pip install '.[etl]'`` on demand.
etl = [
    # pyyaml parses the web<->legacy mappings in migration/mappings/*.yaml.
    # Without it, ``load_mapping()`` raises ModuleNotFoundError on a clean
    # operator install.
    "pyyaml>=6.0",
    # psutil is the fallback when the MSACCESS pre-flight cannot use the
    # native process-query API. >=7.0 (current; 6.1.x was the last with
    # Python 2.7 support, which we don't need — requires-python is ">=3.11").
    "psutil>=7.0",
    # pyodbc is the primary executor for legacy .accdb reads (M0 of
    # live-data-migration-sandbox). >=5.3 (current stable per PyPI 2026
    # release; requires-python >=3.9 covers our Python 3.11 floor).
    # Without it, ``migration.legacy_access_client.execute_legacy_sql``
    # raises ``LegacyReaderError`` so the CLI exits 5 with a clear
    # install hint in the runbook (docs/runbooks/live-migration-apply.md).
    "pyodbc>=5.3",
]

[tool.hatch.build.targets.wheel]
# Fase 1 ships the `app/` package (FastAPI application) and the
# `tests/` package (pytest suite). The wheel installs both so
# `from app.main import app` works in production images and in tests.
#
# The top-level ``migration/`` package is the ETL one-time (web<->legacy
# Access sync). It is NOT shipped in the production wheel because it
# pulls in pyyaml + psutil and runs as a long-lived process the web
# app never needs. Operators install it on demand with
# ``pip install '.[etl]'`` from the source checkout and run
# ``python -m migration`` once.
only-include = ["app", "tests"]

[tool.hatch.build.targets.sdist]
only-include = ["app", "tests", "docs", "pyproject.toml", "README.md", "tailwindcss"]

# Pytest configuration — deprecation strictness per
# docs/architecture-insforge-stack.md § CI/CD Quality Gate.
# Tests of the FastAPI app use ``httpx.ASGITransport`` + ``pytest-asyncio``
# in ``asyncio_mode = "auto"`` to avoid the deprecated
# ``starlette.testclient.TestClient`` path entirely.
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
# Function scope keeps the Playwright sync API from conflicting with
# the event loop reused across sync-vs-async tests in the same run.
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # Skip e2e/ by default — see markers section above for rationale.
    "--ignore=tests/e2e/",
    # Register the critical-helpers coverage gate (PR-1B of hardening-2026-q2).
    # The plugin reads coverage.json after pytest and fails the suite when any
    # CRITICAL_HELPERS entry is below 100% line coverage (warning-only when
    # CRITICAL_HELPERS is empty; first-deploy safety per design.md Slice 1).
    "-p",
    "scripts.pytest_plugin.coverage_gate",
]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]
# E2E tests are excluded from the default run via --ignore because:
# 1. They require a live server at APAP_E2E_BASE_URL (default http://127.0.0.1:8000)
# 2. Playwright's sync_playwright() initialises an event loop at import/collection
#    time that poisons pytest-asyncio's loop for ALL tests in the same process
#    (Runner.run() cannot be called from a running event loop).
# CI runs them as a dedicated job. Local dev: pytest tests/e2e/ (server running).
markers = [
    # E2E tests — require a live server; excluded from default pytest run.
    "e2e: end-to-end browser tests that require APAP_E2E_BASE_URL to be reachable.",
]

# Ruff configuration — fast single-binary linter, current best practice.
# Rule selection matches the architecture doc's quality bar:
#   E/W = pycodestyle (errors + warnings)
#   F   = pyflakes (incl. unused imports, undefined names)
#   I   = isort (import order)
#   UP  = pyupgrade (modern Python syntax)
#   B   = flake8-bugbear (likely bugs and design issues)
# Deprecation-aware rules are covered by F401, F841, B, and the warnings
# themselves being promoted to errors by pytest above.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# APAP001 / APAP003 are registered as a ruff plugin in
# scripts/ruff_plugin/apap_rules.py per tasks.md:T-1B.2, but they are
# NOT added to ``select`` here. Round-2 fix PA-2 outcome (Slice 6,
# PR-6B): ruff 0.15+ does not support Python-defined rule selectors
# in ``select`` regardless of plugin registration (verified locally:
# adding "APAP003" to ``select`` makes ruff fail to parse the config
# with ``Unknown rule selector: `APAP003```). The authoritative
# APAP001 + APAP003 lint gate is therefore Detector 1 + Detector 5
# in ``scripts/check_rules.py``, invoked locally by ``make check-rules``
# and gated in CI by the lint job's ``python scripts/check_rules.py .``
# step (AGENTS.md rule 20, issue #200 — pinned by
# tests/test_ci_workflow.py::test_ci_workflow_lint_job_runs_check_rules_gate).
# The plugin module stays tested as a plain Python AST visitor
# (``tests/test_ruff_apap001.py``, ``tests/test_apap003.py``) so the
# two detectors cannot drift.
#
# Spec: openspec/changes/hardening-2026-q2/specs/01-dev-tooling-gate/spec.md
ignore = [
    # Allow non-ASCII identifiers (Spanish domain: animal names, etc.).
    "E501",
    # FastAPI's idiomatic pattern is ``x = Depends(get_x)`` in the
    # signature; flake8-bugbear flags it but the official docs use it
    # everywhere. Keep the modern FastAPI style.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests can use longer lines, magic values, and relaxed naming.
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]


# --- Coverage gate (PR-1B of hardening-2026-q2) ------------------------
# Spec: openspec/changes/hardening-2026-q2/specs/01-dev-tooling-gate/spec.md
# (REQ-3). Operators may add extra helpers via ``extra_helpers = [...]``
# when a domain-specific helper is added that is not in the named list
# and does not match ``_row_to_*`` regex auto-discovery.
[tool.apap.coverage_gate]
extra_helpers = []
route_layer_minimum = 85



# --- Type checking gate (issue #201, AGENTS.md rule 24) ----------------
# Single source of truth for the mypy scope and flags: `make typecheck`
# and the CI `typecheck` job both run plain `python -m mypy`, which
# reads `files` below. Keeping the scope here (not in CLI args) means
# local and CI runs can never drift.
#
# Scope: app/ AND migration/ are both gated at ZERO errors (32 errors
# were fixed to reach this baseline — annotation-only changes, no
# runtime behavior touched). tests/ and scripts/ are out of scope for
# now (documented follow-up; they are exercised by the suite itself).
#
# Mode: gradual-strict. Not `strict = true` yet — the flags below are
# the moderate base; tightening (e.g. disallow_untyped_defs) may only
# ADD flags, never remove them. Any `# type: ignore` must carry its
# specific error code — enforced by the `ignore-without-code` error
# code below (warn_unused_ignores only removes ignores that are no
# longer needed; see AGENTS.md rule 24).
[tool.mypy]
python_version = "3.11"
# CI runs on Linux and is the authoritative gate; pin the platform so a
# local run on Windows type-checks the exact same view (win32-only ctypes
# attributes are ignored with explicit error codes where needed).
platform = "linux"
files = ["app", "migration"]
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
enable_error_code = ["ignore-without-code"]


# Coverage configuration. Source covers the `app/` package; `tests/`
# is excluded by default. The 80% threshold matches the architecture
# doc's floor and `openspec/config.yaml` `verify.coverage_threshold`.
[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/__init__.py",
    "app/core/__init__.py",
    "app/modules/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
