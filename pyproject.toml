[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apap-web"
version = "0.1.0"
description = "APAP — Registro de Protectoras de Animales de Alcalá (web application)"
readme = "docs/setup.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "APAP Engineering" }]
keywords = ["apap", "animal-shelter", "fastapi", "htmx", "insforge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Database",
]

# Runtime dependencies are intentionally empty in PR 1.
# FastAPI, Uvicorn, Jinja2, Pydantic, HTTPX, python-multipart and the
# InsForge SDK land in the future web-app-skeleton PR, not here.
# PR 1 only ships the local test surface (CI-01).
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
# PR 1 has no application package yet. The wheel is built from the
# `tests/` package so `python -m build` produces a valid artifact.
# The web-app-skeleton PR replaces this with the real package.
only-include = ["tests"]

[tool.hatch.build.targets.sdist]
only-include = ["tests", "docs", "pyproject.toml", "README.md"]

# Pytest configuration — deprecation strictness per
# docs/architecture-insforge-stack.md § CI/CD Quality Gate.
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]

# Ruff configuration — fast single-binary linter, current best practice.
# Rule selection matches the architecture doc's quality bar:
#   E/W = pycodestyle (errors + warnings)
#   F   = pyflakes (incl. unused imports, undefined names)
#   I   = isort (import order)
#   UP  = pyupgrade (modern Python syntax)
#   B   = flake8-bugbear (likely bugs and design issues)
# Deprecation-aware rules are covered by F401, F841, B, and the warnings
# themselves being promoted to errors by pytest above.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    # Allow non-ASCII identifiers (Spanish domain: animal names, etc.).
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests can use longer lines, magic values, and relaxed naming.
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["apap_web"]

# Coverage configuration. Source is left empty for PR 1 because the
# application package (`apap_web/`) does not exist yet. The web-app-
# skeleton PR will set `source = ["apap_web"]` and turn this into the
# real gate. The 80% threshold matches the architecture doc's floor and
# `openspec/config.yaml` `verify.coverage_threshold`.
[tool.coverage.run]
branch = true
source = []

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
